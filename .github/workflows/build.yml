name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup .NET 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Crear proyecto si no existe
        run: |
          if [ ! -f "OyeEscucha/OyeEscucha.csproj" ]; then
            dotnet new maui -n OyeEscucha -o OyeEscucha
          fi

      - name: Guardar proyecto en GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add OyeEscucha
          git commit -m "Crear proyecto OyeEscucha" || echo "Nada nuevo"
          git push || echo "No se pudo subir"

      - name: Build APK
        run: |
          cd OyeEscucha
          dotnet publish -f net10.0-android -c Release -p:AndroidPackageFormat=apk -o ../apk-out

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: oye-escucha-apk
          path: apk-out/*.apk
