name: Build OYE-ESCUCHA APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI
        run: dotnet workload install maui-android
      - name: Recrear proyecto en .NET 10
        run: |
          rm -rf OyeEscucha
          dotnet new maui -n OyeEscucha -o OyeEscucha
      - name: Build APK
        run: dotnet publish OyeEscucha/OyeEscucha.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: oye-escucha-apk
          path: '**/*.apk'
